name: GitHub to Google Sheets Automation

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # 4 vezes ao dia
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install gspread oauth2client requests

      - name: Verificar segredos
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "❌ GH_TOKEN não está configurado"
            exit 1
          fi
          if [ -z "${{ secrets.GOOGLE_CREDS }}" ]; then
            echo "❌ GOOGLE_CREDS não está configurado"
            exit 1
          fi
          echo "✅ Segredos verificados"

      - name: Criar arquivo de credenciais do Google
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: |
          echo "$GOOGLE_CREDS" > credentials.json
          chmod 600 credentials.json  # Importante para segurança
          
          # Verificação detalhada do arquivo
          if [ -s credentials.json ]; then
            echo "✅ Arquivo credentials.json criado com sucesso"
            echo "Tamanho do arquivo: $(wc -c < credentials.json) bytes"
          else
            echo "❌ Falha ao criar credentials.json"
            ls -la
            exit 1
          fi

      - name: Executar script Python com debug
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}  # Note que usamos GH_TOKEN aqui
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
        run: |
          echo "=== Variáveis de ambiente ==="
          printenv | grep -E 'GH_TOKEN|GOOGLE'
          
          echo "=== Conteúdo do credentials.json ==="
          head credentials.json
          
          echo "=== Executando script ==="
          python automations/github_to_sheets.py || {
            echo "❌ Falha na execução do script";
            exit 1;
          }
